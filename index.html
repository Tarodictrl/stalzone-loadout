<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Экипировка и сборки артефактов в STALZONE">
  <title>Экипировка · STALZONE</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <div class="frame">
    <header class="topline">
      <span class="brand">STALZONE</span>
      <p class="timestamp" id="timestamp" hidden>Обновлено <time id="date"></time></p>
    </header>
    <main>
      <div class="page-title"><h1>Экипировка</h1><span class="pill" id="demo" hidden>Демонабор</span></div>
      <p id="status" role="status">Загружаем экипировку…</p>
      <noscript><style>#status{display:none}</style><p>Для просмотра экипировки включите JavaScript.</p></noscript>
      <div id="inventory"></div>
    </main>
  </div>
  <dialog id="inspector" aria-labelledby="inspect-title">
    <div class="inspect-frame">
      <header class="inspect-header">
        <button type="button" id="close" autofocus><span aria-hidden="true">←</span> Назад</button>
        <div><p id="inspect-type" class="kicker"></p><h2 id="inspect-title"></h2></div>
      </header>
      <div id="inspect-content"></div>
    </div>
  </dialog>
</body>
</html>
